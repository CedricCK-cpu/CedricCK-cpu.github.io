<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>內部報名系統</title>
  <style>
    /* --- CSS 樣式 --- */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
    .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 300px; }
    .login-box input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
    .login-box button { background-color: #2c3e50; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; font-size: 16px; }
    .login-box button:hover { background-color: #1a252f; }
    #msg { margin-top: 15px; font-size: 14px; font-weight: bold; }
    .form-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; margin: 0 auto; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
    .form-group input[type="text"], .form-group input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    .form-container button { width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
    .form-container button:disabled { background: #999; cursor: not-allowed; }
    #statusMsg { text-align: center; margin-top: 15px; font-weight: bold; }
    #secret-area { width: 100%; }
  </style>
</head>
<body>

  <div id="login-box" class="login-box">
    <h2>內部系統登入</h2>
    <input type="text" id="username" placeholder="請輸入帳號">
    <input type="password" id="password" placeholder="請輸入密碼">
    <button onclick="doLogin()">登入</button>
    <div id="msg"></div>
  </div>

  <div id="secret-area"></div>

  <script>
    // 👇 ！！！非常重要！！！ 👇
    // 請替換成你剛剛在 GAS 重新部署後拿到的 /exec 網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw7ErSUKbjs4E6-3Lim8BGPIfWNTn1a64qpmA3g-04-kmoVaRbH9aVSCBdUh6aWm9B4/exec";

    // 🌟 全域變數：用來記憶登入成功的帳密
    let currentUser = "";
    let currentPass = "";

    // --- 登入功能 ---
    function doLogin() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const msgDiv = document.getElementById('msg');
      
      if(!u || !p) {
        msgDiv.style.color = "red";
        msgDiv.innerText = "請完整輸入帳號與密碼！";
        return;
      }

      msgDiv.style.color = "blue";
      msgDiv.innerText = "驗證中...";

      // 用 fetch 將帳密送到 GAS
      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "login", user: u, pass: p })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          // ✅ 登入成功：記下帳密，替換畫面，注入表單動作
          currentUser = u;
          currentPass = p;
          document.getElementById('login-box').style.display = 'none';
          document.getElementById('secret-area').innerHTML = data.html;
          initForm(); 
        } else {
          msgDiv.style.color = "red";
          msgDiv.innerText = data.message;
        }
      })
      .catch(error => {
        msgDiv.style.color = "red";
        msgDiv.innerText = "網路連線異常，請重試！";
      });
    }

    // --- 報名表上傳功能 ---
    function initForm() {
      document.getElementById('uploadForm').addEventListener('submit', function(e) {
          e.preventDefault(); 
          const btn = document.getElementById('submitBtn');
          const msg = document.getElementById('statusMsg');

          btn.disabled = true; 
          msg.style.color = "#0056b3";
          msg.innerText = "資料與照片上傳中，請稍候...";

          const name = document.getElementById('empName').value;
          const dept = document.getElementById('empDept').value;
          const fileInput = document.getElementById('uploadFile');
          const file = fileInput.files[0];

          if (file) {
              const reader = new FileReader();
              reader.onload = function(event) {
                  const dataUrl = event.target.result;
                  const base64Data = dataUrl.split(',')[1];

                  // 🌟 將資料打包，並且「夾帶帳號與密碼」一起送出！
                  const payload = {
                      action: "submit", // 告訴 GAS 這次是來送資料的
                      user: currentUser,
                      pass: currentPass,
                      name: name,
                      department: dept,
                      fileName: file.name,
                      mimeType: file.type,
                      fileBase64: base64Data
                  };

                  fetch(GAS_URL, {
                      method: "POST",
                      body: JSON.stringify(payload)
                  })
                  .then(response => response.json())
                  .then(data => {
                      if (data.success) {
                          msg.style.color = "green";
                          msg.innerText = "🎉 報名成功！";
                          document.getElementById('uploadForm').reset(); 
                      } else {
                          msg.style.color = "red";
                          msg.innerText = "發生錯誤：" + data.message;
                      }
                  })
                  .catch(error => {
                      msg.style.color = "red";
                      msg.innerText = "網路連線異常，請重試！";
                  })
                  .finally(() => {
                      btn.disabled = false; 
                  });
              };
              reader.readAsDataURL(file); 
          }
      });
    }
  </script>
</body>
</html>
