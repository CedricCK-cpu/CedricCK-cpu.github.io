 <!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文康活動報名表</title>
    <style>
        /* 簡單的排版樣式，你可以之後自由修改 */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .form-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #999; cursor: not-allowed; }
        #statusMsg { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 style="text-align: center; color: #333;">🎈 員工文康活動報名</h2>
        <form id="uploadForm">
            <div class="form-group">
                <label for="empName">姓名：</label>
                <input type="text" id="empName" placeholder="例如：王大明" required>
            </div>
            <div class="form-group">
                <label for="empDept">部門：</label>
                <input type="text" id="empDept" placeholder="例如：行銷部" required>
            </div>
            <div class="form-group">
                <label for="uploadFile">上傳證明 (活動截圖或照片)：</label>
                <input type="file" id="uploadFile" accept="image/*" required>
            </div>
            <button type="submit" id="submitBtn">送出報名與檔案</button>
            <p id="statusMsg"></p>
        </form>
    </div>

    <script>
        // 👇 ！！！非常重要！！！ 👇
        // 請將下方引號內的網址，換成你剛剛在 GAS 部署後拿到的「網頁應用程式網址」
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzSut1V5n8UYsUIpR41pGbgXZvia-B6Tm4XPWptUS0Jr97SOzdHk0moudwzGlmrM5is/exec";

        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault(); // 阻止網頁重新整理
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('statusMsg');

            btn.disabled = true; // 按鈕反灰，防止重複點擊
            msg.style.color = "#0056b3";
            msg.innerText = "資料與照片上傳中，請稍候...";

            const name = document.getElementById('empName').value;
            const dept = document.getElementById('empDept').value;
            const fileInput = document.getElementById('uploadFile');
            const file = fileInput.files[0];

            if (file) {
                // 使用 FileReader 將檔案轉為 Base64 格式
                const reader = new FileReader();
                reader.onload = function(event) {
                    // 取得轉碼後的字串
                    const dataUrl = event.target.result;
                    // 剃除前綴 (如 data:image/png;base64,)，只保留純粹的編碼文字給 GAS
                    const base64Data = dataUrl.split(',')[1];

                    // 將所有資料打包成一個 JSON 物件
                    const payload = {
                        name: name,
                        department: dept,
                        fileName: file.name,
                        mimeType: file.type,
                        fileBase64: base64Data
                    };

                    // 傳送給 GAS
                    fetch(GAS_URL, {
                        method: "POST",
                        // 使用 text/plain 可以避開瀏覽器惱人的 CORS 預檢請求機制
                        body: JSON.stringify(payload)
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === "success") {
                            msg.style.color = "green";
                            msg.innerText = "🎉 報名成功！";
                            document.getElementById('uploadForm').reset(); // 清空表單
                        } else {
                            msg.style.color = "red";
                            msg.innerText = "發生錯誤：" + data.message;
                        }
                    })
                    .catch(error => {
                        msg.style.color = "red";
                        msg.innerText = "網路連線異常，請重試！";
                    })
                    .finally(() => {
                        btn.disabled = false; // 恢復按鈕
                    });
                };
                
                // 觸發讀取檔案的動作
                reader.readAsDataURL(file); 
            }
        });
    </script>
</body>

</html>
